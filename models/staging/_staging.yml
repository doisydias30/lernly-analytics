# Documentation + tests for staging models.
# Each "test" is a check dbt runs on the data after building it.
# If a test fails, dbt tells you: like a data-quality alarm.
# You'll add entries here for every model you build.

version: 2

models:
  - name: stg_users
    description: One row per Lernly user, cleaned. Signup date, country, channel, device, A/B variant.
    columns:
      - name: user_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: signup_date
        data_tests: [not_null]
      - name: acquisition_channel
        data_tests:
          - accepted_values:
              arguments:
                values: [paid_social, paid_search, organic, referral, app_store]
      - name: device
        data_tests:
          - accepted_values:
              arguments:
                values: [iOS, Android, Web]

  - name: stg_payments
    description: One row per payment attempt, deduplicated, amounts as numbers.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: amount_eur
        data_tests: [not_null]
      - name: user_id
        description: Every payment must belong to a known user.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: [succeeded, failed, refunded]
                
  - name: stg_events
    description: One row per event, with proper types and an event date to group by date.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: event_name
        data_tests:
          - accepted_values:
              arguments:
                values: [signup, onboarding_completed,paywall_viewed,trial_started,signup]

  - name: stg_weekly_activity
    description: One row per user per active week, with a surrogate key activity_id (user_id + week_start).
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
                